# Security scanning. Manual-only until 1 Nov 2026 (Actions minutes exhausted); afterwards add
#   schedule: [{ cron: "0 3 * * 1" }]   and   pull_request: {}
name: Security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config p/java --config p/typescript --config p/owasp-top-ten --config p/secrets --error --metrics=off

  dependency-check:
    name: OWASP Dependency-Check (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Dependency-Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn -B --no-transfer-progress org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=7 -DnvdApiKey=${NVD_API_KEY}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 14

  trivy-fs:
    name: Trivy filesystem (lockfiles, configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
