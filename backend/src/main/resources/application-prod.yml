# Production: HTTPS only, no API docs, structured logs, buckets provisioned by the operator, real scanner required.
server:
  servlet:
    session:
      cookie:
        secure: true

storage:
  ensure-buckets: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  environment: prod

management:
  server:
    # Internal only: not published by Compose, never proxied by nginx. Scrape /actuator/prometheus from the host network.
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    edu.diu.cyberconnect: INFO
